name: Black Earth OS — Deploy GitHub Pages & Daily Automation Cron

on:
  push:
    branches: ["main"]
  schedule:
    # Executa diariamente às 07:00 BRT (10:00 UTC)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-automation-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Black Earth Multi-Agent Automation Cycle
        run: |
          python3 automation_engine.py ALL

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
